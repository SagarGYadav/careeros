# Optional local PostgreSQL with pgvector, for anyone who prefers Docker over Neon.
# Start: docker compose up -d   ·   URLs: see the commented lines in .env.example
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros
      POSTGRES_DB: careeros
    ports:
      - "5432:5432"
    volumes:
      - careeros-pg:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro

volumes:
  careeros-pg:
